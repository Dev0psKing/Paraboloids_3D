<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 7: 3D Function Grapher</title>

    <!--
    STYLING SECTION
    This CSS styles the "info" overlay that displays the function name and controls instructions.
    It uses absolute positioning so it floats on top of the 3D canvas.
    -->
    <style>
        /* Remove default margin from body so canvas fills entire screen */
        body { margin: 0; overflow: hidden; }

        /* Styling for the info box in the top-left corner */
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            background: rgba(0,0,0,0.6); /* Semi-transparent black background */
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none; /* Allows mouse events to pass through to 3D controls */
            z-index: 100;
        }
    </style>
</head>
<body>
    <!--
    HTML OVERLAY
    This div displays the current function being graphed and simple instructions.
    It is NOT required for the 3D logic but helps the user understand what they are viewing.
    -->
    <div id="info">
        <h2>z = x² - y² (Hyperbolic Paraboloid)</h2>
        <p>Drag to Rotate | Scroll to Zoom</p>
    </div>

    <!--
    IMPORT MAP SECTION
    This is a modern JavaScript feature that maps specific library names to CDN URLs.
    It tells the browser: "When you see 'import three', load it from this CDN link."
    This allows us to use Three.js modules directly in the browser without a build tool like Webpack.
    -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <!--
    MAIN JAVASCRIPT SECTION
    The 'type="module"' attribute indicates this script uses ES6 module syntax.
    This allows use of 'import' and 'export' statements and runs in strict mode.
    -->
    <script type="module">
        // =========================================
        // SECTION 1: IMPORTS
        // =========================================
        //
        // Import the core Three.js library. The '*' means 'everything' under the namespace 'THREE'.
        // This gives us access to Scene, Camera, Mesh, Vector3, Geometry, etc.
        import * as THREE from 'three';

        // Import OrbitControls. This is an extension that handles mouse interaction
        // (drag to rotate, scroll to zoom) automatically.
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Import CSS2DRenderer and CSS2DObject. This renderer is used for high-quality
        // 2D text labels (like X, Y, Z axis labels) that always face the camera.
        // We use CSS instead of sprites for cleaner font rendering.
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';


        // =========================================
        // SECTION 2: SCENE SETUP
        // =========================================
        //
        // The Scene is the container for all 3D objects.
        // Think of it as the 'stage' where all actors (objects) are placed.
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122); // Dark blue background (space-like)

        // The PerspectiveCamera simulates the human eye.
        // Arguments: (Field of View, Aspect Ratio, Near Clipping Plane, Far Clipping Plane).
        // 45 degree FOV is a standard, comfortable viewing angle.
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Position the camera in 3D space (X, Y, Z).
        // We place it up and to the right so we can clearly see the grid and the saddle shape.
        camera.position.set(3, 2, 5);

        // Tell the camera to look specifically at the origin point (0, 0, 0).
        camera.lookAt(0, 0, 0);

        // The WebGLRenderer is the engine that draws the 3D graphics to the screen.
        // { antialias: true } smooths jagged edges on diagonal lines.
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight); // Match screen size
        renderer.shadowMap.enabled = true; // Enable shadow calculations (though not heavily used here)
        document.body.appendChild(renderer.domElement); // Add the canvas to the HTML page

        // The CSS2DRenderer handles 2D text labels (X, Y, Z) on top of the 3D scene.
        // We position it absolutely on top of the WebGL canvas.
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        // pointer-events: none allows mouse clicks to pass through the labels to the 3D canvas below.
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);


        // =========================================
        // SECTION 3: CONTROLS (Mouse Interaction)
        // =========================================
        //
        // OrbitControls connects to the camera and the renderer canvas.
        // It listens for mouse drags (rotation) and scrolls (zoom/scale).
        const controls = new OrbitControls(camera, renderer.domElement);

        // Enable damping creates a smooth, inertial feel when you stop moving the mouse.
        controls.enableDamping = true;
        controls.dampingFactor = 0.05; // How 'heavy' the damping feels. Lower = slide further.

        // This restricts panning to the screen plane, which is more intuitive for this type of tool.
        controls.screenSpacePanning = true;

        // Limit how far the user can zoom in and out to prevent clipping or losing the object.
        controls.maxDistance = 15;
        controls.minDistance = 1;


        // =========================================
        // SECTION 4: LIGHTING
        // =========================================
        //
        // AmbientLight provides a base level of illumination to all objects.
        // Without it, the back side of objects would be pitch black.
        // Color is a dark blue/purple.
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // DirectionalLight shines from a specific direction, casting shadows and highlights.
        // This is what gives the 3D surface its depth and form.
        const dirLight = new THREE.DirectionalLight(0xffffff, 1); // White light, full intensity
        dirLight.position.set(1, 2, 1); // Light comes from the top-right-front
        scene.add(dirLight);

        // A second back light helps illuminate the underside of the surface slightly.
        const backLight = new THREE.DirectionalLight(0x4466ff, 0.5); // Blue tint, half intensity
        backLight.position.set(-1, 1, -1); // Light comes from the top-left-back
        scene.add(backLight);


        // =========================================
        // SECTION 5: MATH FUNCTION DEFINITION
        // =========================================
        //
        // This is the core logic of the assignment.
        // This function takes an x and y coordinate and returns the z coordinate.
        // To graph a different function, you only need to change the 'return' statement here.
        function evaluateFunction(x, y) {
            // Current Function: Hyperbolic Paraboloid (Saddle shape).
            // This meets the assignment requirement for one of the specific shapes.
            return (x * x) - (y * y);

            // Other examples (uncomment to test):
            // return x*x + y*y;  // Paraboloid (Cone shape)
            // return Math.sin(x * 2) * Math.cos(y * 2); // Wavy surface
        }


        // =========================================
        // SECTION 6: GENERATING THE SURFACE MESH
        // =========================================
        //
        // We must generate the vertices (points) for our 3D surface manually.
        // The assignment specifies input values between -1 and 1 in increments of 0.1.
        const minVal = -1.0; // Minimum value for X and Y
        const maxVal = 1.0;  // Maximum value for X and Y
        const step = 0.1;    // Increment step

        // Arrays to hold data for our Three.js geometry.
        // 'vertices' will hold flat array of [x1, y1, z1, x2, y2, z2, ...]
        const vertices = [];
        // 'indices' defines which vertices connect to form triangles (faces).
        const indices = [];
        // 'colors' will hold RGB color values for each vertex.
        const colors = [];

        // Helper function to map a value from one range to another.
        // Used here to map Z values to colors (0.0 to 1.0).
        const mapRange = (val, inMin, inMax, outMin, outMax) => {
            return ((val - inMin) / (inMax - inMin)) * (outMax - outMin) + outMin;
        };

        // Calculate how many steps we have.
        // Example: (-1 to 1 at 0.1) = 21 steps. (0, 0.1, 0.2... 1.0)
        const steps = Math.floor((maxVal - minVal) / step) + 1;

        // =========================================
        // Step 6A: Calculate All Z Values (First Pass)
        // =========================================
        //
        // We loop through X and Y. For each pair, we get Z from evaluateFunction.
        // This creates a grid of points.
        let currentIndex = 0;
        let minZ = Infinity;  // Track the lowest Z value for color mapping
        let maxZ = -Infinity; // Track the highest Z value for color mapping

        for (let i = 0; i < steps; i++) {
            const x = minVal + i * step; // Current X coordinate
            for (let j = 0; j < steps; j++) {
                const y = minVal + j * step; // Current Y coordinate
                const z = evaluateFunction(x, y); // Calculate Z

                // Update min/max Z so we know the full range of the surface
                if (z < minZ) minZ = z;
                if (z > maxZ) maxZ = z;

                // Push the XYZ coordinate into our flat vertex array.
                // Three.js expects positions as a flat array: [x,y,z, x,y,z...]
                vertices.push(x, y, z);
                currentIndex++;
            }
        }

        // =========================================
        // Step 6B: Create Indices (Second Pass)
        // =========================================
        //
        // A triangle is defined by 3 vertices. We create two triangles per grid square.
        // This forms a Quad (rectangle) made of two triangles.
        //
        // Grid representation:
        // a --- b
        // |     |
        // c --- d
        //
        // We convert this into indices (a,b,c) and (b,d,c).
        // Three.js uses these indices to know how to 'stitch' the vertices together.
        for (let i = 0; i < steps - 1; i++) {
            for (let j = 0; j < steps - 1; j++) {
                // Calculate the index of each corner in our flat vertex array.
                // Formula: RowIndex * TotalSteps + ColumnIndex
                const a = i * steps + j;         // Top-Left
                const b = i * steps + (j + 1);   // Top-Right
                const c = (i + 1) * steps + j;   // Bottom-Left
                const d = (i + 1) * steps + (j + 1); // Bottom-Right

                // Triangle 1 (Top-Left to Bottom-Right)
                indices.push(a, b, c);
                // Triangle 2 (Bottom-Left to Bottom-Right)
                indices.push(b, d, c);
            }
        }

        // =========================================
        // Step 6C: Generate Vertex Colors
        // =========================================
        //
        // We want the surface to be color-coded based on its height (Z value).
        // Low Z = Blue, Mid Z = Green/Yellow, High Z = Red.
        const rangeZ = maxZ - minZ; // Total height of the surface
        for (let i = 0; i < vertices.length; i += 3) {
            const z = vertices[i+2]; // Get Z value for this vertex

            // Normalize Z to a value between 0 and 1.
            // If the surface is flat (rangeZ=0), default to middle (0.5).
            let t = (rangeZ === 0) ? 0.5 : (z - minZ) / rangeZ;

            // Interpolate RGB values.
            // We use a 2-step gradient: Blue(0) -> Green(0.5) -> Red(1).
            let r, g, b;
            if (t < 0.5) {
                // Lower half: Transition from Blue to Green
                const localT = t * 2; // Scale 0-0.5 to 0-1
                r = 0;
                g = localT;
                b = 1 - localT;
            } else {
                // Upper half: Transition from Green to Red
                const localT = (t - 0.5) * 2; // Scale 0.5-1 to 0-1
                r = localT;
                g = 1 - localT;
                b = 0;
            }
            colors.push(r, g, b);
        }

        // =========================================
        // Step 6D: Build Geometry and Mesh
        // =========================================
        //
        // BufferGeometry is the most efficient way to store vertex data in Three.js.
        const geometry = new THREE.BufferGeometry();

        // Add the position attribute (XYZ coordinates).
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

        // Add the color attribute (RGB values).
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        // Add the indices (which vertices form triangles).
        geometry.setIndex(indices);

        // Compute normals. A normal is a vector pointing perpendicular to the surface.
        // Normals are essential for lighting calculations (shadows, highlights).
        geometry.computeVertexNormals();

        // Material defines how the surface looks.
        // MeshPhongMaterial is good for surfaces that respond to light.
        const material = new THREE.MeshPhongMaterial({
            vertexColors: true, // Use the colors we defined per vertex instead of one flat color
            side: THREE.DoubleSide, // Render both the inside and outside of the surface
            shininess: 30, // How shiny the surface is
            specular: new THREE.Color(0x222222) // Specular highlight color
        });

        // Combine geometry and material into a Mesh object.
        const graphMesh = new THREE.Mesh(geometry, material);

        // Add the mesh to the scene so it becomes visible.
        scene.add(graphMesh);


        // =========================================
        // SECTION 7: REFERENCE PLANE (Grid)
        // =========================================
        //
        // The assignment requires a plane/axis helper for reference.
        // We add a GridHelper to represent the X-Y plane at Z=0.
        // Arguments: (Size of grid, Number of divisions, Center line color, Grid line color)
        const gridHelper = new THREE.GridHelper(4, 20, 0x88aaff, 0x446688);
        gridHelper.position.y = 0; // Ensure it is exactly at the origin
        scene.add(gridHelper);

        // Add a subtle transparent plane underneath the grid to help visualize the surface
        // passing through the origin.
        const planeGeo = new THREE.PlaneGeometry(4, 4);
        const planeMat = new THREE.MeshBasicMaterial({
            color: 0x3366aa,
            transparent: true,
            opacity: 0.1, // Very subtle
            side: THREE.DoubleSide
        });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2; // Rotate 90 degrees so it lies flat (XY plane)
        plane.position.y = -0.01; // Slightly below grid to prevent z-fighting (flickering)
        scene.add(plane);


        // =========================================
        // SECTION 8: AXIS HELPER
        // =========================================
        //
        // The assignment requires a custom axis helper (arrows with X, Y, Z labels).
        // We will create custom arrows and CSS labels.

        // Helper function to create a 3D arrow + 2D CSS label.
        // dir: Direction vector (e.g., (1,0,0) for X)
        // origin: Starting point (e.g., (0,0,0))
        // length: Length of the arrow
        // color: Hex color code
        // labelText: The string to display
        function createArrow(dir, origin, length, color, labelText) {
            // Three.js ArrowHelper: (Direction, Origin, Length, Color, HeadLength, HeadWidth)
            const arrowHelper = new THREE.ArrowHelper(dir, origin, length, color, 0.2, 0.1);
            scene.add(arrowHelper);

            // Create a standard HTML div for the label.
            const div = document.createElement('div');
            div.textContent = labelText;
            div.style.color = 'white';
            div.style.fontSize = '20px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 3px black'; // Shadow makes text readable on any background
            div.style.fontFamily = 'Arial, sans-serif';

            // Wrap the div in a CSS2DObject so it can be placed in 3D space.
            const label = new CSS2DObject(div);

            // Position the label at the tip of the arrow, with a small offset.
            // We clone the origin, add (direction * length), then add a bit more for clearance.
            const pos = origin.clone().add(dir.clone().multiplyScalar(length + 0.2));
            label.position.copy(pos);

            scene.add(label);
        }

        // Create X Axis (Red) pointing along positive X
        createArrow(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 1.8, 0xff3333, 'X');

        // Create Y Axis (Blue) pointing up
        createArrow(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), 1.8, 0x3333ff, 'Y');

        // Create Z Axis (Green) pointing along positive Z
        createArrow(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0), 1.8, 0x33ff33, 'Z');

        // Add a small white sphere at the origin (0,0,0) to anchor the axes visually.
        const originSphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        scene.add(originSphere);


        // =========================================
        // SECTION 9: ANIMATION LOOP
        // =========================================
        //
        // This is the main loop that runs every frame (usually 60 times per second).
        // It updates controls and renders the scene.
        function animate() {
            // Update the controls. This is required when damping is enabled.
            // It calculates the new camera position based on user input.
            controls.update();

            // Render the main WebGL scene (3D objects).
            renderer.render(scene, camera);

            // Render the CSS labels separately on top.
            labelRenderer.render(scene, camera);

            // Request the next frame. This creates the infinite loop.
            requestAnimationFrame(animate);
        }

        // Start the animation loop.
        animate();


        // =========================================
        // SECTION 10: WINDOW RESIZE HANDLER
        // =========================================
        //
        // If the user resizes their browser window, we must adjust the camera
        // aspect ratio and the renderer size, otherwise the image will stretch.
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            // Update aspect ratio to prevent distortion.
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            // Resize both renderers to match the new window size.
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Console log to indicate the script has finished loading successfully.
        console.log("Function Grapher initialized successfully.");
        console.log("Graphing: z = x^2 - y^2");

    </script>
</body>
</html>
